  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .head { font-family: 'Arial Black','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 900; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: .12 } }
    @keyframes caret { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes flow  { to { stroke-dashoffset: -64 } }
    @keyframes sweep { from { stroke-dashoffset: 720 } to { stroke-dashoffset: -80 } }
    @keyframes scan  { from { transform: translateY(-70px) } to { transform: translateY(380px) } }
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-40px) } }
    @keyframes glitchA {
      0%,90%,100% { transform: translate(0,0) }
      91% { transform: translate(-5px,1px) }
      93% { transform: translate(4px,-2px) }
      95% { transform: translate(-3px,0) }
      97% { transform: translate(0,0) }
    }
    @keyframes glitchB {
      0%,86%,100% { transform: translate(0,0) }
      87% { transform: translate(5px,-1px) }
      89% { transform: translate(-4px,2px) }
      92% { transform: translate(3px,0) }
      94% { transform: translate(0,0) }
    }
    .grid  { animation: drift 6s linear infinite }
    .scan  { animation: scan 5.5s linear infinite }
    .flow  { animation: flow 1.6s linear infinite }
    .sweep { animation: sweep 3.6s linear infinite }
    .gA    { animation: glitchA 7s linear infinite }
    .gB    { animation: glitchB 6s linear infinite }
    .caret { animation: caret 1s steps(1,end) infinite }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
